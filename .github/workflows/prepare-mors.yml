name: Przygotuj kadry Morsa
on:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_mors_frames.py'
      - 'assets/komplet ikon.png'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/prepare_mors_frames.py
      - name: Zapisz przygotowane kadry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mors-*.png
          git diff --cached --quiet || git commit -m "Przygotuj osobne przezroczyste kadry Morsa"
          git push
